[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Map the dev-server API routes to Netlify Functions in production.
[[redirects]]
  from = "/api/verify-captcha"
  to = "/.netlify/functions/verify-captcha"
  status = 200

[[redirects]]
  from = "/api/send-response"
  to = "/.netlify/functions/send-response"
  status = 200

# SPA fallback — everything else serves the built index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
